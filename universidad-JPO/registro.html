<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Crear cuenta | Universidad JPO</title>
	<link rel="stylesheet" href="css/registro.css">
</head>
<body>
	<header class="encabezado">
		<h1>Universidad JPO</h1>
		<nav class="menu-superior" aria-label="Navegación principal">
			<a href="index.html">Inicio</a>
			<a href="iniciar-sesion.html">Iniciar sesión</a>
		</nav>
	</header>

	<main class="contenedor-registro">
		<h2>Crear cuenta</h2>
		<form>
			<div class="campo-formulario">
				<label for="nombreCompleto">Nombre completo</label>
				<input type="text" id="nombreCompleto" name="nombreCompleto" required>
			</div>

			<div class="campo-formulario">
				<label for="correo">Correo electrónico</label>
				<input type="email" id="correo" name="correo" required>
			</div>

			<div class="campo-formulario">
				<label for="contrasena">Contraseña</label>
				<input type="password" id="contrasena" name="contrasena" required>
			</div>

			<div class="campo-formulario">
				<label for="rol">Rol</label>
				<select id="rol" name="rol" required>
					<option value="" disabled selected>Selecciona un rol</option>
					<option value="estudiante">Estudiante</option>
					<option value="profesor">Profesor</option>
				</select>
			</div>

			<button type="submit">Crear cuenta</button>
		</form>
		<p class="enlace-inicio-sesion">
			¿Ya tienes cuenta? <a href="iniciar-sesion.html">Iniciar sesión</a>
		</p>
	</main>
	<script src="js/registro.js"></script>
</body>
</html>
