<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Iniciar sesión | Universidad JPO</title>
	<link rel="stylesheet" href="css/iniciar-sesion.css">
</head>
<body>
	<header class="encabezado">
		<h1>Universidad JPO</h1>
		<nav class="menu-superior" aria-label="Navegación principal">
			<a href="index.html">Inicio</a>
			<a href="registro.html">Crear cuenta</a>
		</nav>
	</header>

	<main class="contenedor-inicio-sesion">
		<h2>Iniciar sesión</h2>
		<form>
			<div class="campo-formulario">
				<label for="correo">Correo electrónico</label>
				<input type="email" id="correo" name="correo" required>
			</div>

			<div class="campo-formulario">
				<label for="contrasena">Contraseña</label>
				<input type="password" id="contrasena" name="contrasena" required>
			</div>

			<button type="submit">Iniciar sesión</button>
		</form>
		<p class="enlace-registro">
			¿No tienes cuenta? <a href="registro.html">Crear cuenta</a>
		</p>
		<p class="enlace-inicio">
			<a href="index.html">Volver al inicio</a>
		</p>
	</main>
	<script src="js/iniciar-sesion.js"></script>
</body>
</html>
