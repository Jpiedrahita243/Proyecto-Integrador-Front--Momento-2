<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Mis notas | Universidad JPO</title>
	<link rel="stylesheet" href="css/estudiante.css">
</head>
<body>
	<header class="encabezado">
		<h1>Mis notas</h1>
		<nav class="menu-superior" aria-label="Navegación principal">
			<a href="index.html">Inicio</a>
			<button type="button" id="cerrar-sesion">Cerrar sesión</button>
		</nav>
	</header>

	<main class="contenedor-estudiante">
		<p class="bienvenida">Bienvenido, <span id="nombre-estudiante"></span></p>
		<p id="mensaje-notas"></p>

		<div class="contenedor-tabla">
			<table>
				<thead>
					<tr>
						<th scope="col">Asignatura</th>
						<th scope="col">Calificación</th>
					</tr>
				</thead>
				<tbody id="lista-notas"></tbody>
			</table>
		</div>
	</main>
	<script src="js/estudiante.js"></script>
</body>
</html>
